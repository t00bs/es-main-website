<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Electric Sheep — Work</title>
<script>try { document.documentElement.dataset.theme = localStorage.getItem("es-theme") || "light"; } catch (e) {}</script>
<link rel="stylesheet" href="_ds/electric-sheep-design-system-79fee57b-9852-439b-a61b-a7f994f9c246/tokens/colors.css">
<link rel="stylesheet" href="_ds/electric-sheep-design-system-79fee57b-9852-439b-a61b-a7f994f9c246/tokens/typography.css">
<link rel="stylesheet" href="_ds/electric-sheep-design-system-79fee57b-9852-439b-a61b-a7f994f9c246/tokens/spacing.css">
<link rel="stylesheet" href="_ds/electric-sheep-design-system-79fee57b-9852-439b-a61b-a7f994f9c246/styles.css">
<link rel="stylesheet" href="css/site.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="_ds/electric-sheep-design-system-79fee57b-9852-439b-a61b-a7f994f9c246/_ds_bundle.js"></script>
<script src="js/data.js"></script>
<script type="text/babel" src="js/chrome.jsx"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { SectionLabel, TickerRow, SectionRule, WorkCard } = ES_DS;

function WorkPage() {
  return (
    <div data-screen-label="Work" style={{ background: "var(--surface-page)", minHeight: "100vh" }}>
      <SiteNav></SiteNav>

      <div style={{ padding: "64px 40px 48px 40px", display: "grid", gridTemplateColumns: "460px 1fr", gap: 4 }}>
        <div className="label-readable"><SectionLabel highlight="Work worth staring at.">{""}</SectionLabel></div>
        <span style={{ fontFamily: "var(--font-sans)", fontWeight: 400, fontSize: "var(--text-statement)", lineHeight: "var(--leading-body)", color: "var(--text-primary)" }}>Portals, automations, brands and the occasional machine that learns. Every project below shipped, and every client is still speaking to us.</span>
      </div>

      <div style={{ padding: "0 40px" }}>
        <TickerRow></TickerRow>
        <SectionRule></SectionRule>
      </div>

      <div className="hover-zoom" style={{ padding: "24px 40px 64px 40px", display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 20 }}>
        {window.ES_CASE_STUDIES.map((c) => (
          <WorkCard
            key={c.id}
            src={c.cardImage}
            title={c.title}
            subtitle={c.subtitle}
            showArrow={true}
            size="auto"
            href={"Case Study.html?cs=" + c.id}
            style={{ aspectRatio: "1", width: "auto" }}
          ></WorkCard>
        ))}
        <WorkCard
          title="Your project here."
          subtitle="Say hello and we'll talk"
          showArrow={true}
          size="auto"
          href="Contact.html"
          style={{ aspectRatio: "1", width: "auto" }}
        ></WorkCard>
      </div>

      <SiteFooterStd></SiteFooterStd>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<WorkPage></WorkPage>);
</script>
</body>
</html>
