    body: >-
      Client onboarding meant re-keying the same details into four systems.
      Skilled people were doing unskilled work, and the backlog showed it.
  - type: image
    src: /assets/images/work-generic.jpg
    caption: Intake pipeline — four systems, one entry point.
  - type: text
    label: What we did
    body: >-
      A single intake flow feeding every system at once, with AI-assisted
      document checks and clear handoffs to humans wherever a decision matters.
